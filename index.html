
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (let registration of registrations) {
            registration.unregister();
          }
        });
      }
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>المحول الشامل للخرائط | GeoGIS Pro</title>
    
    <!-- PWA Manifest & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GeoGIS Pro" />
    <meta name="theme-color" content="#0e3f53" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
      :root {
        --primary: #0e3f53;
        --secondary: #165b75;
        --accent: #dcb13c;
        --accent-hover: #b5902b;
      }
      
      body.theme-nwc {
        --primary: #005696;
        --secondary: #007dc3;
        --accent: #82BC00;
        --accent-hover: #6a9a00;
      }

      body.light-mode {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      /* Comprehensive Light Mode styling overrides */
      html.light-mode body,
      body.light-mode {
        background-color: #f8fafc !important;
        color: #0f172a !important;
      }

      body.light-mode .bg-\[\#0a2633\],
      body.light-mode .bg-\[\#0c3647\],
      body.light-mode .bg-\[\#031e29\],
      body.light-mode .bg-\[\#08222f\],
      body.light-mode .bg-\[\#061e29\],
      body.light-mode .bg-\[\#0e3f53\] {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }

      body.light-mode .bg-black\/40,
      body.light-mode .bg-black\/30,
      body.light-mode .bg-black\/20,
      body.light-mode .bg-black\/10 {
        background-color: #f1f5f9 !important;
        color: #0f172a !important;
        border-color: #cbd5e1 !important;
      }

      body.light-mode .bg-white\/5 {
        background-color: #f8fafc !important;
        border-color: #e2e8f0 !important;
      }

      body.light-mode .bg-white\/10 {
        background-color: #e2e8f0 !important;
        border-color: #cbd5e1 !important;
      }

      body.light-mode .bg-white\/20 {
        background-color: #cbd5e1 !important;
      }

      /* Light mode text colors */
      body.light-mode .text-white {
        color: #0f172a !important;
      }

      body.light-mode .text-white\/90,
      body.light-mode .text-white\/80,
      body.light-mode .text-white\/70 {
        color: #1e293b !important;
      }

      body.light-mode .text-white\/60,
      body.light-mode .text-white\/50,
      body.light-mode .text-white\/40,
      body.light-mode .text-white\/30 {
        color: #475569 !important;
      }

      /* Light mode borders */
      body.light-mode .border-white\/5,
      body.light-mode .border-white\/10,
      body.light-mode .border-white\/15,
      body.light-mode .border-white\/20 {
        border-color: #cbd5e1 !important;
      }

      /* Preserve contrast for buttons with bright background colors */
      body.light-mode button.bg-accent,
      body.light-mode .bg-accent {
        color: #0f172a !important;
      }

      body.light-mode button.bg-[#9000FF],
      body.light-mode .bg-\[\#9000FF\],
      body.light-mode button.bg-emerald-600,
      body.light-mode .bg-emerald-600,
      body.light-mode button.bg-red-600,
      body.light-mode .bg-red-600 {
        color: #ffffff !important;
      }

      /* Form inputs in light mode */
      body.light-mode input:not([type="checkbox"]),
      body.light-mode select,
      body.light-mode textarea {
        background-color: #ffffff !important;
        color: #0f172a !important;
        border-color: #94a3b8 !important;
      }

      body.light-mode input::placeholder,
      body.light-mode textarea::placeholder {
        color: #94a3b8 !important;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: transparent;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.3);
        border-radius: 10px;
      }

      /* Hydraulic Flow Direction Animation for Sewer / Gravity Networks */
      @keyframes flowDirectionDash {
        0% {
          stroke-dashoffset: 28;
        }
        100% {
          stroke-dashoffset: 0;
        }
      }

      .flow-direction-animated-pipe {
        stroke-dasharray: 10, 14 !important;
        animation: flowDirectionDash 0.9s linear infinite !important;
        stroke-linecap: round !important;
        stroke-linejoin: round !important;
      }

      /* Pulsing Outfall Marker Ring Animation */
      @keyframes outfallPulseRing {
        0% {
          transform: scale(0.8);
          opacity: 0.9;
        }
        50% {
          transform: scale(1.6);
          opacity: 0.3;
        }
        100% {
          transform: scale(2.2);
          opacity: 0;
        }
      }

      .leaflet-outfall-pulse-bg {
        animation: outfallPulseRing 1.8s cubic-bezier(0, 0, 0.2, 1) infinite;
      }
    </style>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Cairo', 'sans-serif'],
            },
            colors: {
              primary: 'var(--primary)',
              secondary: 'var(--secondary)',
              accent: 'var(--accent)',
              'accent-hover': 'var(--accent-hover)',
            }
          }
        }
      }
    </script>


</head>
  <body class="bg-slate-50 text-slate-900 antialiased h-screen overflow-hidden transition-colors duration-500">
    <div id="root" class="h-full"></div>
  <script type="module" src="/index.tsx"></script>
  </body>
</html>
