<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2d3d" />
      <stop offset="50%" stop-color="#0e3f53" />
      <stop offset="100%" stop-color="#165b75" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d061" />
      <stop offset="100%" stop-color="#dcb13c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Background Container -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#accent)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Grid Lines -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="3" />
  <ellipse cx="256" cy="256" rx="160" ry="70" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3" />
  <line x1="256" y1="96" x2="256" y2="416" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="6 6" />
  <line x1="96" y1="256" x2="416" y2="256" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3" stroke-dasharray="6 6" />

  <!-- GIS Layers Stack Icon -->
  <g filter="url(#shadow)">
    <!-- Layer 3 (Bottom Layer) -->
    <path d="M 256 310 L 370 250 L 256 190 L 142 250 Z" fill="#165b75" fill-opacity="0.9" stroke="#38bdf8" stroke-width="3" />
    <path d="M 142 250 L 256 310 L 370 250 L 370 270 L 256 330 L 142 270 Z" fill="#0e3f53" opacity="0.8" />

    <!-- Layer 2 (Middle Layer) -->
    <path d="M 256 260 L 370 200 L 256 140 L 142 200 Z" fill="#0284c7" fill-opacity="0.8" stroke="#7dd3fc" stroke-width="3" transform="translate(0, -25)" />
    
    <!-- Map Marker / Location Pin on Top -->
    <g transform="translate(0, -20)">
      <path d="M 256 120 C 220 120 190 150 190 186 C 190 235 256 295 256 295 C 256 295 322 235 322 186 C 322 150 292 120 256 120 Z" fill="url(#accent)" stroke="#ffffff" stroke-width="4" />
      <circle cx="256" cy="186" r="28" fill="#0e3f53" />
      <circle cx="256" cy="186" r="14" fill="url(#accent)" />
    </g>
  </g>

  <!-- Title Badge -->
  <rect x="156" y="410" width="200" height="42" rx="21" fill="url(#accent)" />
  <text x="256" y="437" font-family="'Cairo', Arial, sans-serif" font-weight="900" font-size="20" fill="#0b2d3d" text-anchor="middle" letter-spacing="1">GeoGIS PRO</text>
</svg>
